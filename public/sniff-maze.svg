<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Sniff Maze tile" xmlns:c2pa="http://c2pa.org/manifest">
<title>Sniff Maze</title><defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2B2B2B" flood-opacity=".28"/></filter>
<g id="k"><circle r="9" fill="#8B5E34"/><circle cx="-3" cy="-3" r="3.2" fill="#D3A56B"/></g>
<g id="bone"><rect x="-17" y="-5.5" width="34" height="11" rx="5" fill="#EBC98F"/><circle cx="-18" cy="-6" r="6.5" fill="#EBC98F"/><circle cx="-18" cy="6" r="6.5" fill="#EBC98F"/><circle cx="18" cy="-6" r="6.5" fill="#EBC98F"/><circle cx="18" cy="6" r="6.5" fill="#EBC98F"/></g>
</defs>
<rect x="30" y="30" width="340" height="340" rx="44" fill="#3E7A69" filter="url(#sh)"/>
<rect x="30" y="30" width="340" height="340" rx="44" fill="url(#sheen)"/>
<!-- channels -->
<path d="M80 90 H320 V160 H110 V230 H320 V300 H80" fill="none" stroke="#1B3B32" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80 90 H320 V160 H110 V230 H320 V300 H80" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round"/>
