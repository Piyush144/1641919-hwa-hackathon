<circle cx="80" cy="90" r="14" fill="#E0A526"/><path d="M74 90h12M80 84v12" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" transform="rotate(45 80 90)"/>
<circle cx="80" cy="300" r="14" fill="#E0A526"/>
