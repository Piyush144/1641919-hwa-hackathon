<use href="#k" x="130" y="90"/><use href="#k" x="205" y="90"/><use href="#k" x="290" y="125"/>
<use href="#k" x="230" y="160"/><use href="#k" x="140" y="195"/><use href="#k" x="200" y="230"/>
<use href="#k" x="300" y="265"/><use href="#k" x="180" y="300"/>
