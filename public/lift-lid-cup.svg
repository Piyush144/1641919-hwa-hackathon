<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Lift-Lid Cup tile" xmlns:c2pa="http://c2pa.org/manifest">
<title>Lift-Lid Cup</title><defs>
